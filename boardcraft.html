<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BOARDCRAFT · Class X</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&display=swap">
<style>
:root{--bg:#eef1f5;--card:#fff;--tx:#101a2e;--mu:#5d6a80;--ac:#0e7c86;--ac2:#e8f4f5;--bd:#dde3ec;--ok:#15803d;--wn:#b45309;--r:14px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1220;--card:#141c2e;--tx:#e8edf6;--mu:#93a0b8;--ac:#35b6c0;--ac2:#10303a;--bd:#25314a;--ok:#4ade80;--wn:#fbbf24}}
:root[data-theme="dark"]{--bg:#0c1220;--card:#141c2e;--tx:#e8edf6;--mu:#93a0b8;--ac:#35b6c0;--ac2:#10303a;--bd:#25314a;--ok:#4ade80;--wn:#fbbf24}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;margin:0 0 .4em;line-height:1.15}
h1{font-size:1.7rem}h2{font-size:1.15rem}h3{font-size:1rem}
main{max-width:920px;margin:0 auto;padding:16px 14px 96px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:2px;overflow-x:auto;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:0 0 auto;min-width:64px;min-height:48px;border:0;background:none;color:var(--mu);border-radius:10px;font:inherit;font-size:.72rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:1.15rem}
nav button.on{background:var(--ac2);color:var(--ac);font-weight:600}
@media(min-width:900px){nav{top:0;bottom:auto;right:auto;width:150px;flex-direction:column;border-top:0;border-right:1px solid var(--bd);padding-top:20px}nav button{flex-direction:row;gap:8px;font-size:.9rem;padding:0 10px;min-height:42px}main{margin-left:170px;max-width:none;padding-right:30px}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin-bottom:14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.grid .card{margin:0}
.mu{color:var(--mu);font-size:.85rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
button.b,.chip{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
button.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
[data-theme="dark"] button.p{color:#06242a}
.chip{min-height:38px;padding:0 12px;font-size:.85rem}.chip.on{background:var(--ac2);border-color:var(--ac);color:var(--ac);font-weight:600}
input,select,textarea{width:100%;min-height:44px;padding:8px 10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:110px;font:13px/1.45 ui-monospace,Consolas,monospace}
label{display:block;font-size:.8rem;color:var(--mu);margin:8px 0 3px}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.bar{height:8px;border-radius:8px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);border-radius:8px;transition:width .4s}
.item{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}.item:last-child{border:0}
.item input[type=checkbox]{width:22px;min-height:22px;height:22px;flex:none}
.done .t{text-decoration:line-through;color:var(--mu)}
.pri{font-size:.7rem;padding:2px 8px;border-radius:20px;background:var(--ac2);color:var(--ac)}.pri.p1{background:#fde8d8;color:#9a3412}
.note{border-left:4px solid var(--wn);background:var(--card);padding:12px 14px;border-radius:0 var(--r) var(--r) 0;margin-bottom:14px;border:1px solid var(--bd);border-left:4px solid var(--wn)}
.tl{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.tl div{padding:8px 6px;border-radius:10px;background:var(--bg);font-size:.72rem;text-align:center;border:1px solid var(--bd)}.tl .on{background:var(--ac);color:#fff;border-color:var(--ac)}
[data-theme="dark"] .tl .on{color:#06242a}
.big{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:2.6rem;font-variant-numeric:tabular-nums}
iframe{width:100%;height:260px;border:1px solid var(--bd);border-radius:10px;background:#fff}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:9;opacity:0;pointer-events:none;transition:opacity .2s}#toast.on{opacity:1}
.card{transition:transform .2s,box-shadow .2s}
@media(hover:hover){.grid .card:hover{transform:translateY(-3px);box-shadow:0 12px 26px -14px rgba(16,26,46,.4)}button.b:hover{border-color:var(--ac)}}
button{transition:transform .12s,background .2s,border-color .2s}button:active{transform:scale(.96)}
.hero{background:linear-gradient(135deg,#0e7c86,#2a4fd6);color:#fff;border:0;box-shadow:0 14px 30px -16px rgba(42,79,214,.7)}.hero h2{opacity:.85;font-size:.95rem}
.item{transition:opacity .25s}.item.done{opacity:.65}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
@keyframes ri{from{stroke-dasharray:0 100}}
@keyframes bi{from{transform:scaleX(0)}}
.pg>*{animation:up .4s cubic-bezier(.2,.7,.3,1) both}
.pg>*:nth-child(2){animation-delay:.05s}.pg>*:nth-child(3){animation-delay:.1s}.pg>*:nth-child(4){animation-delay:.15s}.pg>*:nth-child(5){animation-delay:.2s}.pg>*:nth-child(n+6){animation-delay:.25s}
.pg .rg{animation:ri 1s .2s cubic-bezier(.2,.7,.3,1) both}
.pg .bar i{transform-origin:left;animation:bi .8s .15s cubic-bezier(.2,.7,.3,1) both}
nav button{transition:background .2s,color .2s}
#toast{transform:translate(-50%,12px);transition:opacity .25s,transform .25s}#toast.on{transform:translate(-50%,0)}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
button,input,select,label,a,nav button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
nav{scroll-behavior:smooth;overscroll-behavior-x:contain;scroll-snap-type:x proximity}nav button{scroll-snap-align:center}
.item .t{transition:color .25s}
.pg>*{will-change:transform,opacity}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
/* ===== BOARDCRAFT: data layer ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toLocaleDateString('en-CA');
const addDays=(d,n)=>{const x=new Date(d+'T00:00');x.setDate(x.getDate()+n);return x.toLocaleDateString('en-CA')};
const sp=s=>s.split('|');
const fmt=t=>{const[h,m]=t.split(':').map(Number);return(h%12||12)+':'+String(m).padStart(2,'0')+(h<12?' AM':' PM')};
const ST=['Not started','Learning','Practiced','Revised','Mastered'];
const CH={Maths:sp('Real Numbers|Polynomials|Pair of Linear Equations|Quadratic Equations|Arithmetic Progressions|Triangles|Coordinate Geometry|Intro to Trigonometry|Applications of Trigonometry|Circles|Areas Related to Circles|Surface Areas & Volumes|Statistics|Probability'),
Science:sp('Chemical Reactions|Acids, Bases & Salts|Metals & Non-metals|Carbon Compounds|Periodic Classification|Life Processes|Control & Coordination|Reproduction|Heredity|Our Environment|Light|Human Eye|Electricity|Magnetic Effects'),
SST:sp('Nationalism in Europe|Nationalism in India|Global World|Print Culture|Industrialisation|Resources & Development|Forest & Wildlife|Water Resources|Agriculture|Minerals & Energy|Manufacturing Industries|Lifelines of Economy|Power Sharing|Federalism|Gender, Religion & Caste|Political Parties|Outcomes of Democracy|Development|Sectors of Economy|Money & Credit|Globalisation|Consumer Rights'),
English:sp('Literature|Grammar|Reading|Writing'),Hindi:sp('Literature|Grammar|Reading|Writing')};
const DAYS=[['What is HTML + first file','Create index.html and show "Hello" in the browser'],['Headings + paragraphs','Write your name as h1 and 3 lines about you as p'],['Text formatting','Use bold, italic and line breaks in your intro'],['Links','Add a link to a site you like'],['Images','Show one image with alt text'],['Lists','Make a list of your 5 subjects'],['Student Profile project','Combine Days 2–6 into one profile page'],['Tables','Build a weekly timetable table'],['Forms','Make a form with name and email'],['Inputs','Try text, number, date and checkbox inputs'],['Buttons + labels','Connect every input to a label'],['Semantic HTML','Rebuild the profile with header/main/footer'],['Accessibility','Check alt text, labels and heading order'],['Study Timetable project','Finish a timetable page in HTML'],['CSS introduction','Link a style.css and change one colour'],['Selectors + colors','Style by tag, class and id'],['Fonts + text','Change font, size and spacing'],['Box model','Draw the box model for one element'],['Margin + padding','Space out your profile cards'],['Width + height + units','Compare px, %, rem and vw'],['Student Profile CSS project','Style the profile page fully'],['Display','Try block, inline and none'],['Flexbox','Centre a card and make a row'],['Flexbox practice','Build a navigation bar'],['CSS Grid','Make a 3-column card grid'],['Grid practice','Build a simple dashboard layout'],['Positioning','Make a sticky header'],['Responsive design','Make the layout fit a phone'],['Media queries','Change columns under 600px'],['Responsive Study Dashboard','Finish the Level 2 project']];
const GL={HTML:'The language that gives a web page its structure: headings, paragraphs, images, links.',CSS:'The language that styles a page: colours, fonts, spacing and layout.',JavaScript:'The language that makes a page react: clicks, calculations, saving data.',DOM:'The browser\'s live tree of your page. JavaScript changes the page by changing the DOM.',API:'A way for one program to ask another for data, such as weather from a weather service.',localStorage:'A small box inside your browser where a page can save text. It stays after you close the tab.',Git:'A tool that saves snapshots of your code so you can go back if something breaks.',GitHub:'A website that stores Git projects online so you can back up and share them.'};
const FIT={Beginner:['5 min warm-up (arm circles, marching)','15 min bodyweight: wall push-ups, squats, plank 3×20s','10 min brisk walk or light skipping','5 min mobility','5 min cool-down + water'],Normal:['5 min warm-up','20 min bodyweight: push-ups, squats, lunges, plank','10 min jog or outdoor game','5 min mobility','5 min cool-down'],Easy:['10 min easy walk outdoors','10 min gentle stretching','5 min slow breathing','Stop early if tired. Rest counts.']};
const MOT=['Consistency beats intensity.','Small progress is still progress.','Learn it. Practice it. Test it. Fix it.','Finish today\'s priorities before chasing tomorrow.','Practice makes concepts automatic.'];
const PH=[['Phase 1','Oct 2–31','Syllabus + concepts'],['Phase 2','Nov','Pre-Board 1'],['Phase 3','Dec','Pre-Board 2'],['Phase 4','Jan','PYQs + mocks'],['Phase 5','Feb','Final revision']];
const OFF=[1,3,7,14];
const FW=['Easy recovery / walk / stretching','Strength','Cardio + mobility','Strength','Light cardio + mobility','Strength','Sport / walk + mobility'];
const B7=['Day −7: Complete syllabus checklist','Day −6: NCERT + important questions','Day −5: PYQs','Day −4: Full timed paper','Day −3: Paper analysis + weak chapters','Day −2: Formulas, definitions, maps, writing formats','Day −1: Light revision + proper sleep'];
const PG=['Maths + Science foundation and major syllabus completion.','Pre-Board 1 preparation. In the last 7–10 days, switch to the school date sheet.','Fix Pre-Board 1 mistakes permanently, then prepare for Pre-Board 2.','95%+ phase: PYQs, sample papers, mistake elimination.','Boards: the nearest paper gets 70–80% of academic time.'];
const dExam=()=>S.exam?Math.round((new Date(S.exam+'T00:00')-new Date(today()+'T00:00'))/864e5):null;
const dayPlan=()=>{const n=dExam();if(n===0)return['Exam day: only formulas, definitions, diagrams, maps, keywords. No new topic.'];if(n>0&&n<=7)return[B7[7-n]];return PL[today().slice(5)]||[]};
const MT=['Notes','PDF','Image','Question paper','PYQ','Formula sheet','Revision sheet','Code','Project'];
const PL={};`10-03|Maths: Real Numbers FTA + irrationality|SST: Nationalism in Europe 1

const webPh=()=>{const d=today().slice(5);return d<'02-01'?'Portfolio + 2 mini projects':d<'10-03'?'30 min maintenance, or pause in board-heavy weeks':d<'10-11'?'HTML':d<'10-26'?'CSS':d<'11-16'?'CSS project + JavaScript basics':'JavaScript: DOM, events, forms'};

const def=()=>({exam:'',name:'Student',theme:'system',target:95,nid:20,notif:false,notified:'',sub:'Maths',lvl:'Normal',done:{},rev:{},ch:{},mist:[],tests:[],fit:{},
chaps:JSON.parse(JSON.stringify(CH)),
tasks:[[1,'06:00','Morning revision (yesterday\'s formulas and definitions)',1],[3,'17:50','Fitness (~45 min)',2],[5,'20:45','Web Development (90 min)',2],[6,'22:15','Mistake log + plan tomorrow',2]].map(a=>({id:a[0],t:a[1],title:a[2],pri:a[3],rec:1})),
web:{done:{},mins:0,sess:[],code:null},pyq:{}});
let S=def();
try{const r=JSON.parse(localStorage.getItem('bc1'));if(r&&typeof r==='object')S=Object.assign(S,r)}catch(e){}
if(!S.v2){S.tasks=def().tasks;S.v2=1}
function save(){try{localStorage.setItem('bc1',JSON.stringify(S))}catch(e){toast('Could not save. Browser storage may be full or blocked.')}}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2600)}

/* ===== helpers ===== */
const todayTasks=()=>S.tasks.filter(t=>t.rec||t.date===today()).concat(dayPlan().map((x,i)=>({id:i?'ps':'pm',t:i?'19:00':'16:20',title:x,pri:1,v:1}))).sort((a,b)=>a.t.localeCompare(b.t));
const isDone=id=>(S.done[today()]||[]).includes(String(id));
function acad(){let s=0,n=0;for(const k in S.chaps)S.chaps[k].forEach((_,i)=>{s+=(S.ch[k+i]||0)/4;n++});return n?Math.round(s/n*100):0}
function subPct(k){const c=S.chaps[k];return c.length?Math.round(c.reduce((a,_,i)=>a+(S.ch[k+i]||0)/4,0)/c.length*100):0}
const webPct=()=>Math.round(Object.keys(S.web.done).length/30*100);
const webDay=()=>{for(let i=0;i<30;i++)if(!S.web.done[i])return i;return 29};
function revQueue(){const q=[];for(const k in S.rev){const r=S.rev[k];if(r.n<4&&addDays(r.start,OFF[r.n])<=today())q.push({k,r})}return q}
function name(k){const m=k.match(/^(\D+)(\d+)$/);return m?[m[1],S.chaps[m[1]]?.[+m[2]]||'']:[k,'']}
const ring=(p,l)=>`<div style="text-align:center"><svg width="86" height="86" viewBox="0 0 36 36" role="img" aria-label="${l} ${p}%"><circle cx="18" cy="18" r="15.5" fill="none" stroke="var(--bd)" stroke-width="3"/><circle cx="18" cy="18" r="15.5" fill="none" class="rg" stroke="var(--ac)" stroke-width="3" stroke-linecap="round" stroke-dasharray="${p*0.974} 100" transform="rotate(-90 18 18)"/><text x="18" y="20.5" text-anchor="middle" font-size="8" fill="currentColor" font-weight="700">${p}%</text></svg><div class="mu">${l}</div></div>`;
const empty=(t,s)=>`<div class="card" style="text-align:center"><h3>${t}</h3><p class="mu">${s}</p></div>`;
const phaseIdx=()=>({9:0,10:1,11:2,0:3,1:4})[new Date().getMonth()]??0;

/* ===== pages ===== */
const pages={
home(){const h=new Date().getHours(),g=h<12?'Good morning':h<17?'Good afternoon':'Good evening';
const tt=todayTasks(),d=tt.filter(t=>isDone(t.id)).length,p1=tt.filter(t=>t.pri==1&&!isDone(t.id)),nx=p1[0]||tt.find(t=>!isDone(t.id));
const m=MOT[Math.floor(Date.now()/864e5)%MOT.length],f=S.fit[today()];
return`<h1>${g}, ${esc(S.name)}.</h1><p class="mu">${new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'})} · Target ${S.target}%+ · ${m}</p>
${h>=21&&p1.length?`<div class="note">Your planned study for today isn't complete yet. Review the ${p1.length} remaining priority task(s) below.</div>`:''}
<div class="card hero"><h2>Next priority</h2><p style="font-size:1.1rem;margin:0">${nx?esc(nx.title):'All planned tasks done. Rest well.'}</p></div>
<div class="card row sp" style="justify-content:space-around">${ring(acad(),'Academics')}${ring(webPct(),'Web Dev')}${ring(tt.length?Math.round(d/tt.length*100):0,'Today')}</div>
<div class="grid"><div class="card"><h3>Today's tasks</h3><div class="big">${d}/${tt.length}</div></div>
<div class="card"><h3>Revision queue</h3><div class="big">${revQueue().length}</div><button class="b" onclick="go('rev')">Open</button></div>
<div class="card"><h3>Web Dev</h3><div class="big">Day ${webDay()+1}</div><div class="mu">${(S.web.mins/60).toFixed(1)} h coded</div></div>

let mq='',mf='';
const DB=new Promise((res,rej)=>{try{const q=indexedDB.open('bc',1);q.onupgradeneeded=()=>q.result.createObjectStore('f',{keyPath:'id'});q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}catch(e){rej(e)}});DB.catch(()=>{});
const tx=async(m,fn)=>{const d=await DB;return new Promise((res,rej)=>{const t=d.transaction('f',m),r=fn(t.objectStore('f'));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})};
async function matList(){const el=$('#ml');if(!el)return;try{let a=await tx('readonly',s=>s.getAll());const q=mq.toLowerCase();a=a.filter(x=>(!mf||x.sub==mf)&&(!q||(x.name+' '+x.tags).toLowerCase().includes(q))).sort((a,b)=>b.fav-a.fav||b.date.localeCompare(a.date));
el.innerHTML=a.length?a.map(x=>`<div class="card"><div class="row sp"><b>${esc(x.name)}</b><button class="chip" onclick="matMod('${x.id}',y=>y.fav=!y.fav)" aria-label="Favourite">${x.fav?'★':'☆'}</button></div><div class="mu">${esc(x.sub)} · ${esc(x.type)} · ${Math.round(x.size/1024)} KB · ${esc(x.tags)}</div><div class="row" style="margin-top:8px"><button class="chip" onclick="matOpen('${x.id}')">Open / download</button><button class="chip" onclick="matRen('${x.id}')">Rename</button><button class="chip" onclick="matDel('${x.id}')">Delete</button></div></div>`).join(''):empty('No study material yet','Add your first note or PDF to build your personal library.')}catch(e){el.innerHTML=empty('Storage unavailable','This browser blocked local file storage.')}}
async function matAdd(){const fs=[...$('#f-f').files];if(!fs.length)return toast('Choose a file first.');try{for(const f of fs)await tx('readwrite',s=>s.put({id:'m'+Date.now()+Math.random().toString(36).slice(2,6),name:f.name,sub:$('#f-s').value,type:$('#f-t').value,tags:$('#f-g').value,fav:false,date:today(),size:f.size,blob:f}));toast('Added.');$('#f-f').value='';matList()}catch(e){toast('Could not store the file. Storage may be full.')}}
async function matMod(id,fn){try{const x=await tx('readonly',s=>s.get(id));if(!x)return;fn(x);await tx('readwrite',s=>s.put(x));matList()}catch(e){toast('Could not update.')}}
function matRen(id){const n=prompt('New name');if(n)matMod(id,x=>x.name=n.slice(0,80))}
async function matDel(id){if(!confirm('Delete this file?'))return;try{await tx('readwrite',s=>s.delete(id));matList()}catch(e){toast('Could not delete.')}}
async function matOpen(id){try{const x=await tx('readonly',s=>s.get(id));if(!x)return;const a=document.createElement('a');a.href=URL.createObjectURL(x.blob);a.download=x.name;a.click()}catch(e){toast('Could not open the file.')}}
/* ===== web dev timer ===== */
let T={left:5400,run:false,id:null};
function tUpd(){const e=$('#tm');if(!e)return;const m=Math.floor(T.left/60),s=T.left%60;e.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');const el=(5400-T.left)/60,P=[[10,'Revise'],[35,'Learn the concept'],[70,'Code along'],[85,'Independent challenge'],[90,'Notes + plan tomorrow']];$('#ph').textContent=(P.find(p=>el<p[0])||P[4])[1]+(T.run?'':' (paused)')}
function tStart(){if(T.run)return;T.run=true;T.id=setInterval(()=>{T.left--;tUpd();if(T.left<=0)tFin()},1000);tUpd()}
function tPause(){T.run=false;clearInterval(T.id);tUpd()}
function tFin(){tPause();const m=Math.round((5400-T.left)/60);if(m>0){S.web.mins+=m;S.web.sess.push({d:today(),m});save();toast(m+' minutes added.')}T.left=5400;render()}

/* ===== playground ===== */
const starter=()=>({h:'<h1>Hello!</h1>\n<button id="b">Click me</button>',c:'h1{color:teal}',j:'document.getElementById("b").onclick=()=>alert("It works!");'});
let ck='h';
function cTab(k){ck=k;if(!S.web.code)S.web.code=starter();$('#cd').value=S.web.code[k];document.querySelectorAll('[data-k]').forEach(b=>b.classList.toggle('on',b.dataset.k==k))}
let ct;function cEd(){S.web.code[ck]=$('#cd').value;clearTimeout(ct);ct=setTimeout(save,500)}
function cReset(){S.web.code=starter();cTab(ck);runCode()}
function runCode(){const c=S.web.code||starter();$('#er').textContent='';$('#fr').srcdoc='<style>'+c.c+'</style>'+c.h+'<script>onerror=function(m){parent.postMessage({bcErr:String(m)},"*")};'+c.j+'<\/script>'}
addEventListener('message',e=>{if(!e.data||!e.data.bcErr||!$('#er'))return;const m=e.data.bcErr;
$('#er').textContent=/not defined/.test(m)?'JavaScript cannot find this name. Check that you spelled it correctly and created it first.':/Unexpected|Invalid or unexpected/.test(m)?'Syntax error: a bracket, quote or comma is probably missing or extra near your last edit.':/null|undefined/.test(m)?'Your code is using something that does not exist. Check the id or class in your HTML matches your JavaScript.':'Something went wrong in your JavaScript: '+m});

applyTheme();render();
</script>
</body>
</html>
